name: Build and Release

on: 
  push:
    branches-ignore: [shadPS4QtLauncher-*]

  pull_request:


concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  BUILD_TYPE: Release

jobs:
  reuse:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
    - uses: actions/checkout@v5
    - uses: fsfe/reuse-action@v5

  clang-format:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Install
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main'
        sudo apt update
        sudo apt install clang-format-19
    - name: Build
      env:
        COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      run: ./.ci/clang-format.sh
      
  get-info:
    runs-on: ubuntu-24.04
    outputs:
      date: ${{ steps.vars.outputs.date }}
      shorthash: ${{ steps.vars.outputs.shorthash }}
      fullhash: ${{ steps.vars.outputs.fullhash }}
    steps:
    - uses: actions/checkout@v5
    - name: Get date and git hash
      id: vars
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
        echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        
  windows-qt:
    runs-on: windows-2025
    needs: get-info
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Fetch commit history
      run: |
        git fetch origin --unshallow --filter=blob:none

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.0
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        archives: qtbase qttools
        modules: qtmultimedia

    - name: Cache CMake Configuration
      uses: actions/cache@v6
      env:
          cache-name: ${{ runner.os }}-qt-ninja-cache-cmake-configuration
      with:
          path: | 
            ${{github.workspace}}/build
          key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ env.cache-name }}-

    - name: Cache CMake Build
      uses: hendrikmuhs/ccache-action@v1.2.23
      env:
          cache-name: ${{ runner.os }}-qt-cache-cmake-build
      with:
        append-timestamp: false
        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

    - name: Configure CMake
      run: cmake --fresh -G Ninja -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DENABLE_UPDATER=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $env:NUMBER_OF_PROCESSORS

    - name: Deploy and Package
      run: |
        mkdir upload
        mkdir upload/qtplugins
        move build/GR2Launcher.exe upload
        cp dist/qt.conf upload/qt.conf
        # The prompt packs and the FSR 4 files sit next to the launcher, so the self-updater's zip
        # carries them too, outside the user folder: a non-empty user folder in that zip would make
        # a non-portable install portable. The launcher copies them into the user folder.
        Copy-Item -Recurse dist/prompt_mods upload/prompt_mods
        Copy-Item -Recurse dist/fsr4_v07 upload/fsr4_v07
        windeployqt --plugindir upload/qtplugins --no-compiler-runtime --no-system-d3d-compiler --no-system-dxc-compiler --dir upload upload/GR2Launcher.exe
        mkdir upload/user
        mkdir upload/launcher
        Compress-Archive -Path upload/* -DestinationPath GR2Launcher-win64-qt-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}.zip

    - name: Upload Windows Qt artifact
      uses: actions/upload-artifact@v7
      with:
        name: GR2Launcher-win64-qt-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
        path: upload/
        
  macos-qt:
    runs-on: macos-latest
    needs: get-info
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Fetch commit history
      run: |
        git fetch origin --unshallow --filter=blob:none

    - name: Setup latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.0
        host: mac
        target: desktop
        arch: clang_64
        archives: qtbase qttools
        modules: qtmultimedia

    - name: Cache CMake Configuration
      uses: actions/cache@v6 
      env: 
          cache-name: ${{ runner.os }}-qt-cache-cmake-configuration
      with: 
          path: |  
            ${{github.workspace}}/build 
          key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }} 
          restore-keys: | 
            ${{ env.cache-name }}- 

    - name: Cache CMake Build
      uses: hendrikmuhs/ccache-action@v1.2.23
      env:
          cache-name: ${{ runner.os }}-qt-cache-cmake-build
      with:
        append-timestamp: false
        create-symlink: true
        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
        variant: sccache

    - name: Configure CMake
      run: cmake --fresh -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DENABLE_UPDATER=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --parallel $(sysctl -n hw.ncpu)

    - name: Package and Upload macOS Qt artifact
      run: |
        mkdir upload
        mv ${{ github.workspace }}/build/GR2Launcher.app upload
        macdeployqt upload/GR2Launcher.app
        codesign --deep -fs - upload/GR2Launcher.app
        tar cf GR2Launcher-macos-qt.tar.gz -C upload .
    - uses: actions/upload-artifact@v7
      with:
        name: GR2Launcher-macos-qt-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
        path: GR2Launcher-macos-qt.tar.gz

  linux-qt:
    runs-on: ubuntu-24.04
    needs: get-info
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Fetch commit history
      run: |
        git fetch origin --unshallow --filter=blob:none

    - name: Add LLVM repository
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main'

    - name: Install dependencies
      run: sudo apt-get update && sudo apt install -y libx11-dev libxext-dev libwayland-dev libdecor-0-dev libxkbcommon-dev libglfw3-dev libgles2-mesa-dev libfuse2 clang-19 mold build-essential libasound2-dev libpulse-dev libopenal-dev libudev-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.0
        arch: linux_gcc_64
        modules: "qtmultimedia"
        tools: 'tools_generic'
        setup-python: false
        cache: true

    - name: Cache CMake Configuration
      uses: actions/cache@v6 
      env: 
          cache-name: ${{ runner.os }}-qt-cache-cmake-configuration
      with: 
          path: |  
            ${{github.workspace}}/build 
          key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }} 
          restore-keys: | 
            ${{ env.cache-name }}- 

    - name: Cache CMake Build
      uses: hendrikmuhs/ccache-action@v1.2.23
      env:
          cache-name: ${{ runner.os }}-qt-cache-cmake-build
      with:
        append-timestamp: false
        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

    - name: Configure CMake
      run: cmake --fresh -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=mold" -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=mold" -DENABLE_UPDATER=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $(nproc)

    - name: Run AppImage packaging script
      run:  ./.github/linux-appimage-qt.sh

    - name: Package and Upload Linux Qt artifact
      run: |
        tar cf GR2Launcher-linux-qt.tar.gz -C ${{github.workspace}}/build GR2Launcher
        # The prompt packs and the FSR 4 files sit next to the launcher as in the Windows artifact.
        mkdir upload
        cp -a GR2Launcher.AppImage dist/prompt_mods dist/fsr4_v07 upload/
    - uses: actions/upload-artifact@v7
      with:
        name: GR2Launcher-linux-qt-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
        path: upload/
        
  linux-qt-gcc:
    runs-on: ubuntu-24.04
    needs: get-info
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Fetch commit history
      run: |
        git fetch origin --unshallow --filter=blob:none

    - name: Install dependencies
      run: sudo apt-get update && sudo apt install -y libx11-dev libxext-dev libwayland-dev libdecor-0-dev libxkbcommon-dev libglfw3-dev libgles2-mesa-dev libfuse2 gcc-14 mold build-essential libasound2-dev libpulse-dev libopenal-dev libudev-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.0
        arch: linux_gcc_64
        modules: "qtmultimedia"
        tools: 'tools_generic'
        setup-python: false
        cache: true
        
    - name: Cache CMake Configuration
      uses: actions/cache@v6 
      env: 
          cache-name: ${{ runner.os }}-qt-gcc-cache-cmake-configuration
      with: 
          path: |  
            ${{github.workspace}}/build 
          key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }} 
          restore-keys: | 
            ${{ env.cache-name }}- 

    - name: Cache CMake Build
      uses: hendrikmuhs/ccache-action@v1.2.23
      env:
          cache-name: ${{ runner.os }}-qt-gcc-cache-cmake-build
      with:
        append-timestamp: false
        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

    - name: Configure CMake
      run: cmake --fresh -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=mold" -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=mold" -DENABLE_UPDATER=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $(nproc)

  pre-release:
    if: github.ref == 'refs/heads/main' && github.repository == 'junminlee2004/GR2Launcher' && github.event_name == 'push'
    needs: [get-info, windows-qt, macos-qt, linux-qt]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Compress individual directories (without parent directory)
      run: |
        cd ./artifacts
        # Artifacts lose the executable bit and empty folders, so both are restored here. The
        # empty user and launcher folders make the extracted launcher portable.
        chmod a+x GR2Launcher-linux-qt-*/GR2Launcher.AppImage
        for dir in */; do
          if [ -d "$dir" ]; then
            dir_name=${dir%/}
            mkdir -p "$dir_name/user" "$dir_name/launcher"
            echo "Creating zip for $dir_name"
            (cd "$dir_name" && zip -r "../${dir_name}.zip" .)
          fi
        done
  
    - name: Bundle the latest GR2fork pre-release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # The self-updater copies its whole zip over the install, so the emulator and the launcher
        # data that registers it go into separate with-emulator zips that the updater never picks.
        # Their user folder also holds the FSR 4 files, for an emulator started without the
        # launcher that copies them there.
        release=$(curl -sfL -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/junminlee2004/GR2fork/releases" |
          jq -c '[.[] | select(.tag_name | startswith("Pre-release-GR2fork-EXODUS-"))][0]')
        tag=$(echo "$release" | jq -r '.tag_name // empty')
        if [ -z "$tag" ]; then
          echo "No GR2fork pre-release found"
          exit 1
        fi
        echo "Bundling $tag"
        for platform in win64 linux macos; do
          case $platform in
            win64) exe=shadPS4.exe ;;
            linux) exe=Shadps4-sdl.AppImage ;;
            macos) exe=shadps4 ;;
          esac
          src=./artifacts/GR2Launcher-$platform-qt-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
          dest=./bundles/$platform
          version_dir="$dest/launcher/versions/Pre-release"
          mkdir -p "$version_dir"
          if [ $platform = macos ]; then
            # The app opened from Finder runs from / and uses Application Support, so no user
            # folder is added and the shortcut shares the launcher's emulator data.
            tar -xf "$src/GR2Launcher-macos-qt.tar.gz" -C "$dest"
          else
            cp -a "$src/." "$dest/"
            # The emulator reads its FSR 4 files from the user folder. macOS builds have no FSR.
            cp -a "$src/fsr4_v07" "$dest/user/fsr4_v07"
          fi
          url=$(echo "$release" | jq -r --arg p "$platform-sdl" \
            '[.assets[] | select(.name | contains($p))][0].browser_download_url // empty')
          if [ -z "$url" ]; then
            echo "No $platform-sdl asset in $tag"
            exit 1
          fi
          curl -sfL -o "emulator-$platform.zip" "$url"
          unzip -q -o "emulator-$platform.zip" -d "$version_dir"

          # Registers the bundled emulator the way the launcher's own pre-release install does.
          exe_path="launcher/versions/Pre-release/$exe"
          jq -n --arg path "$exe_path" --arg hash "${tag##*-}" \
            --arg date "${{ needs.get-info.outputs.date }}" \
            '[{codename: $hash, date: $date, name: "Pre-release (GR2fork-EXODUS)", path: $path, type: 1}]' \
            > "$dest/launcher/versions.json"
          printf '[version_manager]\nversionSelected=%s\n' "$exe_path" > "$dest/launcher/qt_ui.ini"

          # Big picture shortcuts run from the launcher folder, so they use its user folder. On
          # Windows and Linux they start the emulator through the launcher (-d: its selected
          # version, -i: no IPC, as a direct start), which first copies the bundled files into the
          # user folder.
          if [ $platform = win64 ]; then
            printf '@echo off\r\ncd /d "%%~dp0"\r\nstart "" "GR2Launcher.exe" -i -d -- -b\r\n' \
              > "$dest/GR2fork Big Picture.cmd"
          elif [ $platform = linux ]; then
            shortcut="$dest/GR2fork Big Picture.sh"
            printf '#!/bin/sh\ncd "$(dirname "$0")" || exit 1\nexec ./GR2Launcher.AppImage -i -d -- -b\n' \
              > "$shortcut"
            chmod a+x "$shortcut"
          else
            shortcut="$dest/GR2fork Big Picture.command"
            printf '#!/bin/sh\ncd "$(dirname "$0")" || exit 1\nexec ./%s -b\n' "$exe_path" > "$shortcut"
            chmod a+x "$shortcut"
          fi

          # -y keeps the symlinks inside the macOS app.
          (cd "$dest" && zip -qry "../../artifacts/GR2Launcher-$platform-with-emulator-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}.zip" .)
        done

    - name: Get latest release information
      id: get_latest_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        api_url="https://api.github.com/repos/${{ github.repository }}"
        latest_release_info=$(curl -H "Authorization: token $GITHUB_TOKEN" "$api_url/releases/latest")
        echo "last_release_tag=$(echo "$latest_release_info" | jq -r '.tag_name')" >> $GITHUB_ENV

    - name: Create Pre-Release on GitHub
      id: create_release
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: "GR2Launcher-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}"
        tag: "GR2Launcher-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.fullhash }}"
        commit: ${{ needs.get-info.outputs.fullhash }}
        draft: false
        prerelease: true
        body: "Auto-generated release for the latest commit to main."
        artifacts: ./artifacts/*.zip
        
    - name: Get current pre-release information
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        api_url="https://api.github.com/repos/${{ github.repository }}/releases"
        
        # Get all releases (sorted by date)
        releases=$(curl -H "Authorization: token $GITHUB_TOKEN" "$api_url")
        
        # Capture the most recent pre-release (assuming the first one is the latest)
        current_release=$(echo "$releases" | jq -c '.[] | select(.prerelease == true and (.tag_name | startswith("GR2Launcher-"))) | .published_at' | sort -r | head -n 1)
        
        # Remove extra quotes from captured date
        current_release=$(echo $current_release | tr -d '"')
                
        # Export the current published_at to be available for the next step
        echo "CURRENT_PUBLISHED_AT=$current_release" >> $GITHUB_ENV
    
    - name: Delete old pre-releases and tags
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        api_url="https://api.github.com/repos/${{ github.repository }}/releases"
        
        # Get current pre-releases
        releases=$(curl -H "Authorization: token $GITHUB_TOKEN" "$api_url")
                
        # Remove extra quotes from captured date
        CURRENT_PUBLISHED_AT=$(echo $CURRENT_PUBLISHED_AT | tr -d '"')
        
        # Convert CURRENT_PUBLISHED_AT para timestamp Unix
        current_published_ts=$(date -d "$CURRENT_PUBLISHED_AT" +%s)
        
        # Identify pre-releases
        echo "$releases" | jq -c '.[] | select(.prerelease == true and (.tag_name | startswith("GR2Launcher-")))' | while read -r release; do
          release_date=$(echo "$release" | jq -r '.published_at')
          release_id=$(echo "$release" | jq -r '.id')
          release_tag=$(echo "$release" | jq -r '.tag_name')
          
          # Remove extra quotes from captured date
          release_date=$(echo $release_date | tr -d '"')
          
          # Convert release_date para timestamp Unix
          release_date_ts=$(date -d "$release_date" +%s)
                    
          # Compare timestamps and delete old pre-releases
          if [[ "$release_date_ts" -lt "$current_published_ts" ]]; then
            echo "Deleting old pre-release: $release_id from $release_date with tag: $release_tag"
            # Delete the pre-release
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" "$api_url/$release_id"
            # Delete the tag
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$release_tag"
          else
            echo "Skipping pre-release: $release_id (newer or same date)"
          fi
        done
